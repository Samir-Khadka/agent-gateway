# Example policy, as users would write it (from the project plan).
# A support bot may read customers and email inside the company, may
# refund small amounts, and needs a human for refunds over 100. Once
# it has touched untrusted content it may not email outside the
# company at all. Anything not listed here is denied.
agent: support-bot
risk_tier: medium
allow:
  - tool: crm.read_customer
    limits: { max_rows: 20 }
  - tool: email.send
    where: { to_domain: ["company.com"] }
  - tool: refund.create
    when: { amount_lte: 100 }
  - tool: web.fetch
require_approval:
  - tool: refund.create
    when: { amount_gt: 100 }
deny_when_tainted:
  - tool: email.send
    where: { to_domain_not: ["company.com"] }
egress_allowlist: ["company.com", "*.company.com"]
taint_sources: ["web.fetch"]
budgets:
  max_calls: 100
  max_spend: 5.00
  max_rows_read: 1000
  rate_limits: { email.send: 10 }
costs:
  crm.read_customer: 0.01
  email.send: 0.02
  refund.create: 0.05
  web.fetch: 0.01
