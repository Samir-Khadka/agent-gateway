# Policy test cases for the support bot. Run:
#   python -m gateway.test_policy policies/support-bot.yaml tests/policies/support-bot.cases.yaml
cases:
  - name: read within the row limit
    tool: crm.read_customer
    args: { customer_id: cust_1, limit: 5 }
    expected: allow
  - name: read over the row limit
    tool: crm.read_customer
    args: { customer_id: cust_1, limit: 50 }
    expected: deny
  - name: email inside the company
    tool: email.send
    args: { to: team@company.com, subject: hi, body: hello }
    expected: allow
  - name: email outside the company
    tool: email.send
    args: { to: attacker@evil.com, subject: x, body: y }
    expected: deny
  - name: small refund
    tool: refund.create
    args: { customer_id: cust_1, amount: 50 }
    expected: allow
  - name: large refund needs a human
    tool: refund.create
    args: { customer_id: cust_1, amount: 150 }
    expected: require_approval
  - name: unknown tool is denied
    tool: db.delete_all
    args: {}
    expected: deny
  - name: tainted external email is denied
    tool: email.send
    args: { to: attacker@evil.com, subject: x, body: y }
    tainted: true
    expected: deny
  - name: tainted internal email still works
    tool: email.send
    args: { to: team@company.com, subject: hi, body: hello }
    tainted: true
    expected: allow
