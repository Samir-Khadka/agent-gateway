[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.6.0"
description = "A firewall for what AI agents do, not what they say"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["gateway*"]
